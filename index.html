<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>To-Do List</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
    <main class="mx-auto w-full max-w-4xl px-4 py-8 sm:px-6 sm:py-12">
      <div id="storage-alert" class="storage-alert mb-4 rounded-xl border border-amber-300 bg-amber-50 px-4 py-3 text-sm text-amber-900" role="alert" hidden></div>

      <section class="rounded-3xl bg-white p-5 shadow-xl shadow-slate-200/60 sm:p-9" aria-labelledby="app-title">
        <header class="mb-8">
          <div class="mb-7 flex items-start justify-between gap-4">
            <div>
              <p class="mb-2 text-xs font-bold uppercase tracking-widest text-indigo-600">오늘도 차근차근</p>
              <h1 id="app-title" class="text-3xl font-bold tracking-tight text-slate-900">To-Do List</h1>
              <p id="today-date" class="mt-1 text-sm text-slate-500"></p>
            </div>
            <span class="grid size-12 shrink-0 place-items-center rounded-2xl bg-indigo-50 text-2xl font-extrabold text-indigo-600" aria-hidden="true">✓</span>
          </div>

          <div class="rounded-2xl bg-slate-50 p-4">
            <div class="mb-2 flex items-center justify-between gap-3">
              <span class="font-semibold text-slate-700">오늘의 진행률</span>
              <span id="progress-label" class="text-sm text-slate-500" aria-live="polite">0/0 완료 (0%)</span>
            </div>
            <div
              id="progress-bar"
              class="h-3 overflow-hidden rounded-full bg-slate-200"
              role="progressbar"
              aria-label="할 일 진행률"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div class="progress-fill h-full rounded-full bg-gradient-to-r from-indigo-500 to-violet-500 transition-[width] duration-200"></div>
            </div>
          </div>
        </header>

        <section class="mb-8 rounded-2xl border border-indigo-100 bg-indigo-50/50 p-4 sm:p-5" aria-labelledby="add-todo-heading">
          <h2 id="add-todo-heading" class="mb-4 text-lg font-bold text-slate-800">새로운 할 일</h2>
          <form id="todo-form" novalidate>
            <div class="input-grid">
              <div class="todo-text-field">
                <label for="todo-text" class="mb-1.5 block text-sm font-semibold text-slate-600">할 일 내용</label>
                <input
                  id="todo-text"
                  name="text"
                  class="field-control w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-base text-slate-800 outline-none transition focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100"
                  type="text"
                  placeholder="새로운 할 일을 입력하세요"
                  maxlength="500"
                  aria-describedby="todo-error"
                  autocomplete="off"
                >
                <div id="todo-error" class="input-error mt-1 text-sm text-red-600" aria-live="polite"></div>
              </div>
              <div>
                <label for="todo-due-date" class="mb-1.5 block text-sm font-semibold text-slate-600">마감 일시</label>
                <input id="todo-due-date" name="dueDateTime" class="field-control w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-base text-slate-800 outline-none transition focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100" type="datetime-local">
              </div>
              <div>
                <label for="todo-priority" class="mb-1.5 block text-sm font-semibold text-slate-600">우선순위</label>
                <select id="todo-priority" name="priority" class="field-control w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-base text-slate-800 outline-none transition focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100">
                  <option value="HIGH">높음</option>
                  <option value="MEDIUM" selected>보통</option>
                  <option value="LOW">낮음</option>
                </select>
              </div>
              <button class="add-button inline-flex min-h-11 items-center justify-center gap-2 rounded-xl bg-indigo-600 px-5 py-2.5 font-bold text-white transition hover:bg-indigo-700 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-indigo-200" type="submit">
                <span aria-hidden="true">＋</span>
                추가
              </button>
            </div>
          </form>
        </section>

        <section aria-label="할 일 목록">
          <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
            <h2 class="text-xl font-bold text-slate-900">내 할 일</h2>
            <p class="text-sm text-slate-500">작은 한 걸음이 큰 변화를 만들어요.</p>
          </div>

          <div class="todo-tabs mb-4 grid grid-cols-3 border-b border-slate-200" role="tablist" aria-label="할 일 상태 필터">
            <button class="tab-button active min-h-11 px-2 py-2.5 text-sm font-semibold text-slate-500 transition hover:text-indigo-600 sm:text-base" id="filter-all" type="button" role="tab" aria-selected="true" aria-controls="todo-list" data-filter="ALL">전체 <span class="tab-count" data-count="ALL">0</span></button>
            <button class="tab-button min-h-11 px-2 py-2.5 text-sm font-semibold text-slate-500 transition hover:text-indigo-600 sm:text-base" id="filter-active" type="button" role="tab" aria-selected="false" aria-controls="todo-list" data-filter="ACTIVE" tabindex="-1">진행 중 <span class="tab-count" data-count="ACTIVE">0</span></button>
            <button class="tab-button min-h-11 px-2 py-2.5 text-sm font-semibold text-slate-500 transition hover:text-indigo-600 sm:text-base" id="filter-completed" type="button" role="tab" aria-selected="false" aria-controls="todo-list" data-filter="COMPLETED" tabindex="-1">완료 <span class="tab-count" data-count="COMPLETED">0</span></button>
          </div>

          <ul id="todo-list" class="todo-list m-0 list-none p-0" role="list" aria-live="polite"></ul>
          <div id="empty-state" class="rounded-2xl border border-dashed border-slate-300 bg-slate-50 px-5 py-10 text-center text-slate-500" hidden>
            <div class="mb-3 text-3xl text-indigo-400" aria-hidden="true">✦</div>
            <p id="empty-message" class="m-0"></p>
          </div>
        </section>
      </section>
      <dialog id="delete-dialog" class="delete-dialog w-[calc(100%-2rem)] max-w-md rounded-3xl border-0 bg-white p-0 text-slate-800 shadow-2xl backdrop:bg-slate-950/50" aria-labelledby="delete-dialog-title" aria-describedby="delete-dialog-description">
        <div class="p-6 sm:p-8">
          <div class="despair-icon mx-auto mb-5 grid size-28 place-items-center rounded-full" role="img" aria-label="금빛 장식에 둘러싸인 슬픈 얼굴">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle cx="60" cy="60" r="56" fill="#f8edcc" stroke="#bc8d2d" stroke-width="2"/>
              <path d="M60 8 66 20 78 11 79 26 94 22 89 37 105 40 95 52 109 62 95 71 103 86 87 88 89 104 74 99 66 113 57 101 44 110 41 94 25 96 31 81 16 74 27 62 13 52 28 43 21 28 37 29 39 13 52 21Z" fill="#e7c56b" opacity=".82"/>
              <path d="M39 36c4-8 12-12 22-12s18 4 22 12l7 18-7 28c-4 14-13 21-22 21s-18-7-22-21l-7-28Z" fill="#f4dfbd" stroke="#76592c" stroke-width="2"/>
              <path d="M38 42c3-17 14-25 25-25 13 0 22 8 25 24l-10-8-8 7-11-8-9 9-8-5Z" fill="#403325"/>
              <path d="M45 56c4-4 9-4 13 0m5 0c4-4 9-4 13 0" fill="none" stroke="#493b31" stroke-linecap="round" stroke-width="3"/>
              <path d="M60 59c-2 8-4 12-4 15 0 3 2 5 4 5s4-2 4-5c0-3-2-7-4-15Z" fill="#8ab6bd"/>
              <path d="M50 84c6 4 14 4 20 0" fill="none" stroke="#765044" stroke-linecap="round" stroke-width="2.5"/>
              <path d="m25 49 6 4-5 6-6-4Zm70 9 6-4 4 7-6 4ZM37 92l7 2-2 7-7-2Zm43 5 6-5 5 6-6 5Z" fill="#fff7d7" stroke="#bc8d2d"/>
              <circle cx="24" cy="73" r="3" fill="#98702b"/><circle cx="96" cy="35" r="3" fill="#98702b"/>
            </svg>
          </div>
          <p class="mb-1 text-center text-sm font-semibold uppercase tracking-widest text-amber-700">작별 인사</p>
          <h2 id="delete-dialog-title" class="text-center text-2xl font-bold text-slate-900">정말 삭제할까요?</h2>
          <p id="delete-dialog-description" class="mt-2 text-center text-slate-600">이 할 일을 목록에서 영구적으로 삭제합니다.</p>
          <p id="delete-todo-text" class="delete-todo-text mt-4 rounded-xl bg-slate-50 px-4 py-3 text-center font-semibold text-slate-700"></p>
          <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-center">
            <button id="cancel-delete" class="min-h-11 rounded-xl border border-slate-300 px-5 py-2.5 font-semibold text-slate-700 transition hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-slate-200" type="button">취소</button>
            <button id="confirm-delete" class="min-h-11 rounded-xl bg-rose-600 px-5 py-2.5 font-semibold text-white transition hover:bg-rose-700 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-rose-200" type="button">삭제</button>
          </div>
        </div>
      </dialog>
      <p class="mt-5 text-center text-sm text-slate-400">할 일을 하나씩 완료하며 오늘을 채워보세요.</p>
    </main>
  </body>
</html>
