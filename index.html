<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>To-Do List</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container app-shell py-4 py-md-5">
      <div id="storage-alert" class="alert alert-warning storage-alert" role="alert" hidden></div>

      <section class="app-card card border-0 shadow-sm" aria-labelledby="app-title">
        <div class="card-body p-4 p-md-5">
          <header class="app-header mb-4">
            <div class="d-flex flex-wrap align-items-start justify-content-between gap-3 mb-4">
              <div>
                <p class="eyebrow mb-2">오늘도 차근차근</p>
                <h1 id="app-title" class="h2 fw-bold mb-1">To-Do List</h1>
                <p id="today-date" class="text-secondary mb-0"></p>
              </div>
              <span class="header-mark" aria-hidden="true">✓</span>
            </div>

            <div class="progress-summary">
              <div class="d-flex align-items-center justify-content-between gap-3 mb-2">
                <span class="fw-semibold">오늘의 진행률</span>
                <span id="progress-label" class="small text-secondary" aria-live="polite">0/0 완료 (0%)</span>
              </div>
              <div
                id="progress-bar"
                class="progress app-progress"
                role="progressbar"
                aria-label="할 일 진행률"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
              >
                <div class="progress-bar"></div>
              </div>
            </div>
          </header>

          <section class="input-panel p-3 p-md-4 mb-4" aria-labelledby="add-todo-heading">
            <h2 id="add-todo-heading" class="h6 fw-bold mb-3">새로운 할 일</h2>
            <form id="todo-form" novalidate>
              <div class="input-grid">
                <div class="todo-text-field">
                  <label for="todo-text" class="form-label">할 일 내용</label>
                  <input
                    id="todo-text"
                    name="text"
                    class="form-control"
                    type="text"
                    placeholder="새로운 할 일을 입력하세요"
                    maxlength="500"
                    aria-describedby="todo-error"
                    autocomplete="off"
                  >
                  <div id="todo-error" class="invalid-feedback" aria-live="polite"></div>
                </div>
                <div>
                  <label for="todo-due-date" class="form-label">마감 일시</label>
                  <input id="todo-due-date" name="dueDateTime" class="form-control" type="datetime-local">
                </div>
                <div>
                  <label for="todo-priority" class="form-label">우선순위</label>
                  <select id="todo-priority" name="priority" class="form-select">
                    <option value="HIGH">높음</option>
                    <option value="MEDIUM" selected>보통</option>
                    <option value="LOW">낮음</option>
                  </select>
                </div>
                <button class="btn btn-primary add-button" type="submit">
                  <span aria-hidden="true">＋</span>
                  추가
                </button>
              </div>
            </form>
          </section>

          <section aria-label="할 일 목록">
            <div class="list-heading d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
              <h2 class="h5 fw-bold mb-0">내 할 일</h2>
              <div class="small text-secondary">작은 한 걸음이 큰 변화를 만들어요.</div>
            </div>

            <div class="todo-tabs nav nav-tabs mb-3" role="tablist" aria-label="할 일 상태 필터">
              <button
                class="nav-link active"
                id="filter-all"
                type="button"
                role="tab"
                aria-selected="true"
                aria-controls="todo-list"
                data-filter="ALL"
              >전체 <span class="tab-count" data-count="ALL">0</span></button>
              <button
                class="nav-link"
                id="filter-active"
                type="button"
                role="tab"
                aria-selected="false"
                aria-controls="todo-list"
                data-filter="ACTIVE"
                tabindex="-1"
              >진행 중 <span class="tab-count" data-count="ACTIVE">0</span></button>
              <button
                class="nav-link"
                id="filter-completed"
                type="button"
                role="tab"
                aria-selected="false"
                aria-controls="todo-list"
                data-filter="COMPLETED"
                tabindex="-1"
              >완료 <span class="tab-count" data-count="COMPLETED">0</span></button>
            </div>

            <ul id="todo-list" class="todo-list list-unstyled mb-0" role="list" aria-live="polite"></ul>
            <div id="empty-state" class="empty-state text-center p-4 p-md-5" hidden>
              <div class="empty-icon mb-3" aria-hidden="true">✦</div>
              <p id="empty-message" class="mb-0"></p>
            </div>
          </section>
        </div>
      </section>
      <p class="app-footer text-center small text-secondary mt-4 mb-0">할 일을 하나씩 완료하며 오늘을 채워보세요.</p>
    </main>
  </body>
</html>
